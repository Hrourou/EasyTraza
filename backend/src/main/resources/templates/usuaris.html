<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EasyTraza - Gestión de Usuarios</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-container": "#bb5808", "on-secondary-container": "#783603",
                        "secondary": "#934b19", "on-surface": "#1e1b13",
                        "surface-container": "#f5edde", "secondary-container": "#ffa26a",
                        "surface-container-low": "#fbf3e4", "on-surface-variant": "#564338",
                        "surface-container-highest": "#e9e2d3", "on-primary": "#ffffff",
                        "primary": "#974400", "on-error": "#ffffff", "surface": "#fff8ef",
                        "error-container": "#ffdad6", "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                    },
                    fontFamily: {
                        "headline": ["Lexend"], "body": ["Lexend"], "label": ["Lexend"]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Lexend', sans-serif; min-height: 100dvh; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-thumb { background-color: rgba(151, 68, 0, 0.2); border-radius: 10px; }
        input:read-only, select:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex overflow-x-hidden relative">

    <div th:replace="~{fragments/navbar :: menu-lateral('usuaris')}"></div>

    <main class="flex-1 md:ml-80 flex flex-col min-h-screen transition-all duration-300" id="main-content">
        <div class="p-6 md:p-8 lg:px-16 lg:py-8 max-w-7xl mx-auto w-full flex-1 flex flex-col">
            
            <div class="mb-6 flex flex-col xl:flex-row justify-between items-start xl:items-end gap-4">
                <div>
                    <h1 class="text-4xl lg:text-5xl font-black text-on-surface tracking-tighter mb-2" th:text="#{users.title}">Usuarios</h1>
                    <p class="text-lg text-on-surface-variant max-w-2xl" th:text="#{users.subtitle}">Administra los usuarios del sistema.</p>
                </div>
                <button type="button" onclick="openModal('create')" class="bg-gradient-to-br from-primary to-primary-container text-on-primary h-16 px-8 rounded-2xl flex items-center justify-center gap-3 hover:opacity-90 transition-all shadow-lg shadow-primary/20 hover:-translate-y-1">
                    <span class="material-symbols-outlined text-2xl">person_add</span>
                    <span class="text-lg font-bold" th:text="#{users.add_btn}">Añadir Usuario</span>
                </button>
            </div>

            <div class="relative w-full mb-8">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
                <input id="searchInput" onkeyup="filterUsers()" class="w-full pl-12 pr-4 py-3 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary text-on-surface font-medium transition-all placeholder:text-on-surface-variant/60" th:placeholder="#{users.search_placeholder}" type="text"/>
            </div>
            <div th:if="${globalError}" class="bg-error-container text-on-error-container p-4 rounded-2xl flex items-center gap-4 mb-6">
                <span class="material-symbols-outlined text-2xl">error</span>
                <p class="font-bold text-md" th:text="${globalError}"></p>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                
                <div th:if="${#lists.isEmpty(usuaris)}" class="col-span-full bg-surface-container p-10 rounded-3xl text-center border-2 border-dashed border-primary/20">
                    <span class="material-symbols-outlined text-6xl text-primary/40">group</span>
                    <h3 class="text-2xl font-bold text-on-surface mt-4" th:text="#{users.empty}">Aún no hay usuarios</h3>
                </div>

                <div th:each="user : ${usuaris}" 
                     class="bg-surface-container-lowest p-6 rounded-3xl space-y-4 hover:shadow-lg transition-shadow border border-outline-variant/30 group relative user-card flex flex-col items-center text-center cursor-pointer"
                     th:data-nom="${user.nom}" th:data-cognom="${user.cognom}" th:data-dni="${user.dni}"
                     th:data-email="${user.email}" th:data-tel="${user.telefon}" th:data-dir="${user.direccio}"
                     th:data-rol="${user.rol?.name()}"
                     onclick="openModal('view', this)">
                    
                    <div class="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button type="button" class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center text-secondary hover:bg-primary hover:text-white transition-all shadow-sm"
                                onclick="openModal('edit', this.closest('.user-card')); event.stopPropagation();">
                            <span class="material-symbols-outlined text-[18px]">edit</span>
                        </button>
                        <button type="button" th:data-dni="${user.dni}" onclick="openDeleteModal(this.getAttribute('data-dni')); event.stopPropagation();" class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center text-error hover:bg-error hover:text-white transition-all shadow-sm">
                            <span class="material-symbols-outlined text-[18px]">delete</span>
                        </button>
                    </div>

                    <div class="w-24 h-24 rounded-full flex items-center justify-center text-3xl font-bold shadow-inner"
                         th:classappend="${user.rol?.name() == 'ADMIN' ? 'bg-primary text-white' : 'bg-secondary/20 text-secondary'}">
                        <img th:if="${user.fotoPerfilUrl != null and user.fotoPerfilUrl != ''}" 
                             th:src="${user.fotoPerfilUrl}" 
                             alt="Foto" 
                             class="w-full h-full object-cover rounded-full" />
                        <span th:unless="${user.fotoPerfilUrl != null and user.fotoPerfilUrl != ''}" 
                              th:text="${#strings.substring(user.nom, 0, 1).toUpperCase()}">U</span>
                    </div>

                    <div>
                        <h3 class="text-xl font-bold text-on-surface">
                            <span th:text="${user.nom}">Nom</span> <span th:text="${user.cognom}">Cognoms</span>
                        </h3>
                        <p class="text-xs font-bold uppercase tracking-widest mt-1"
                           th:text="#{${'users.form.role.' + #strings.toLowerCase(user.rol)}}" 
                           th:classappend="${user.rol?.name() == 'ADMIN' ? 'text-primary' : 'text-secondary opacity-70'}">ROL</p>
                    </div>
                    
                    <div class="text-sm text-secondary/60 break-all" th:text="${user.email}"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="userModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8 bg-black/50 backdrop-blur-sm transition-opacity">
        <div class="bg-surface w-full max-w-2xl max-h-[90dvh] rounded-[2rem] shadow-2xl overflow-hidden flex flex-col relative">
            
            <div class="p-8 pb-4 flex justify-between items-start border-b border-surface-container-highest">
                <div class="space-y-1">
                    <h2 id="modalSubtitle" class="text-[0.7rem] font-bold uppercase tracking-[0.2em] text-secondary" th:text="#{users.modal.subtitle}">Registro</h2>
                    <h3 id="modalTitle" class="text-3xl font-black text-on-surface tracking-tight" th:text="#{users.modal.title}">Usuario</h3>
                </div>
                <button type="button" onclick="closeModal()" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container text-secondary hover:bg-error-container hover:text-error transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div class="px-8 py-6 flex-1 overflow-y-auto modal-scroll">
                
                <div th:if="${error}" class="bg-error-container text-on-error-container p-4 rounded-2xl flex items-center gap-4 mb-6">
                    <span class="material-symbols-outlined text-2xl">error</span>
                    <p class="font-bold text-md" th:text="${error}"></p>
                </div>

                <form id="userForm" action="/admin/usuaris/save" method="post" class="space-y-6" th:object="${usuariNou}">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-secondary px-2 uppercase tracking-wider" th:text="#{users.form.name}">Nombre *</label>
                            <input id="form_nom" th:field="*{nom}" class="w-full h-14 px-6 bg-surface-container-low border-none rounded-xl font-medium focus:ring-2 focus:ring-primary" type="text" required/>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-secondary px-2 uppercase tracking-wider" th:text="#{users.form.surname}">Apellidos *</label>
                            <input id="form_cognom" th:field="*{cognom}" class="w-full h-14 px-6 bg-surface-container-low border-none rounded-xl font-medium focus:ring-2 focus:ring-primary" type="text" required/>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-secondary px-2 uppercase tracking-wider" th:text="#{users.form.dni}">DNI / NIF *</label>
                            <input id="form_dni" th:field="*{dni}" class="w-full h-14 px-6 bg-surface-container-low border-none rounded-xl font-medium focus:ring-2 focus:ring-primary" type="text" required/>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-secondary px-2 uppercase tracking-wider" th:text="#{users.form.email}">Email (Acceso) *</label>
                            <input id="form_email" th:field="*{email}" class="w-full h-14 px-6 bg-surface-container-low border-none rounded-xl font-medium focus:ring-2 focus:ring-primary" type="email" required/>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-secondary px-2 uppercase tracking-wider" th:text="#{users.form.phone}">Teléfono</label>
                            <input id="form_tel" th:field="*{telefon}" class="w-full h-14 px-6 bg-surface-container-low border-none rounded-xl font-medium focus:ring-2 focus:ring-primary" type="tel"/>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-secondary px-2 uppercase tracking-wider" th:text="#{users.form.role}">Rol en el sistema *</label>
                            <select id="form_rol" th:field="*{rol}" class="w-full h-14 px-6 bg-surface-container-low border-none rounded-xl font-medium focus:ring-2 focus:ring-primary">
                                <option value="TREBALLADOR" th:text="#{users.form.role.worker}">Trabajador</option>
                                <option value="ADMIN" th:text="#{users.form.role.admin}">Administrador</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs font-bold text-secondary px-2 uppercase tracking-wider" th:text="#{users.form.address}">Dirección</label>
                        <input id="form_dir" th:field="*{direccio}" class="w-full h-14 px-6 bg-surface-container-low border-none rounded-xl font-medium focus:ring-2 focus:ring-primary" type="text"/>
                    </div>

                    <div id="password_div" class="space-y-2">
                        <label class="text-xs font-bold text-secondary px-2 uppercase tracking-wider" th:text="#{users.form.password}">Contraseña</label>
                        <input id="form_password" th:field="*{password}" class="w-full h-14 px-6 bg-surface-container-low border-none rounded-xl font-medium focus:ring-2 focus:ring-primary" type="password" th:placeholder="#{users.form.password.placeholder}" minlength="8"/>
                    </div>

                    <div class="pt-6 flex gap-4">
                        <button type="button" onclick="closeModal()" class="flex-1 h-16 bg-surface-container-highest text-secondary font-bold text-lg rounded-xl hover:bg-[#ddc1b3] transition-colors" th:text="#{users.btn.close}">Cerrar</button>
                        <button type="submit" id="btnSubmit" class="flex-[2] h-16 bg-primary text-white font-bold text-lg rounded-xl shadow-lg hover:opacity-90 transition-colors">
                            <span id="btnSubmitText" th:text="#{users.btn.save}">Guardar Usuario</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="hidden fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm transition-opacity">
        <div class="bg-surface w-full max-w-sm rounded-[2rem] shadow-2xl p-8 text-center">
            <div class="w-20 h-20 bg-error-container rounded-full flex items-center justify-center text-error mx-auto mb-6">
                <span class="material-symbols-outlined text-4xl">warning</span>
            </div>
            <h3 class="text-2xl font-bold text-on-surface mb-2" th:text="#{users.delete.title}">¿Eliminar Usuario?</h3>
            <p class="text-secondary opacity-80 mb-8" th:text="#{users.delete.subtitle}">Esta acción no se puede deshacer.</p>
            <div class="flex gap-4">
                <button type="button" onclick="closeDeleteModal()" class="flex-1 py-3 bg-surface-container font-bold rounded-xl hover:bg-surface-container-high transition-colors" th:text="#{users.btn.cancel}">Cancelar</button>
                <form id="deleteForm" action="/admin/usuaris/delete" method="post" class="flex-1">
                    <input type="hidden" name="dni" id="delete_dni">
                    <button type="submit" class="w-full py-3 bg-error text-white font-bold rounded-xl shadow-lg hover:opacity-90 transition-opacity" th:text="#{users.btn.delete}">Eliminar</button>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const mainContent = document.getElementById('main-content');

        function openModal(mode, btn = null) {
            const modal = document.getElementById('userModal');
            const form = document.getElementById('userForm');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnSubmitText = document.getElementById('btnSubmitText');
            const passwordDiv = document.getElementById('password_div');
            
            const inputs = form.querySelectorAll('input:not([type=hidden])');
            const selects = form.querySelectorAll('select');
            
            modal.classList.remove('hidden');
            mainContent.classList.add('blur-sm');

            if (mode === 'create') {
                document.getElementById('modalTitle').innerText = [[#{users.modal.create_title}]];
                form.action = "/admin/usuaris/save";
                
                btnSubmit.style.display = 'block';
                btnSubmitText.innerText = [[#{users.modal.create_btn}]];
                passwordDiv.style.display = 'block';
                
                if(![[${hasErrors}]]) {
                    inputs.forEach(i => { i.value = ''; i.removeAttribute('readonly'); });
                    selects.forEach(s => s.removeAttribute('disabled'));
                    document.getElementById('form_rol').value = 'TREBALLADOR';
                } else {
                     inputs.forEach(i => i.removeAttribute('readonly'));
                     selects.forEach(s => s.removeAttribute('disabled'));
                }
                
                document.getElementById('form_password').required = true;

            } else if (mode === 'edit' && btn) {
                document.getElementById('modalTitle').innerText = [[#{users.modal.edit_title}]];
                form.action = "/admin/usuaris/update"; 
                
                btnSubmit.style.display = 'block';
                btnSubmitText.innerText = [[#{users.modal.edit_btn}]];
                passwordDiv.style.display = 'block';
                
                inputs.forEach(i => i.removeAttribute('readonly'));
                selects.forEach(s => s.removeAttribute('disabled'));
                
                rellenarFormulario(btn);
                
                const inputDni = document.getElementById('form_dni');
                inputDni.setAttribute('readonly', 'true');
                inputDni.classList.add('opacity-70');

                document.getElementById('form_password').value = '';
                document.getElementById('form_password').required = false;

            } else if (mode === 'editError') {
                document.getElementById('modalTitle').innerText = [[#{users.modal.edit_title}]];
                form.action = "/admin/usuaris/update"; 
                btnSubmit.style.display = 'block';
                btnSubmitText.innerText = [[#{users.modal.edit_btn}]];
                passwordDiv.style.display = 'block';
                
                inputs.forEach(i => i.removeAttribute('readonly'));
                selects.forEach(s => s.removeAttribute('disabled'));
                
                const inputDni = document.getElementById('form_dni');
                inputDni.setAttribute('readonly', 'true');
                inputDni.classList.add('opacity-70');

                document.getElementById('form_password').required = false;

            } else if (mode === 'view' && btn) {
                document.getElementById('modalTitle').innerText = [[#{users.modal.view_title}]];
                
                btnSubmit.style.display = 'none';
                passwordDiv.style.display = 'none';
                
                inputs.forEach(i => i.setAttribute('readonly', true));
                selects.forEach(s => s.setAttribute('disabled', true));
                
                rellenarFormulario(btn);
            }
        }

        function rellenarFormulario(elemento) {
            document.getElementById('form_nom').value = elemento.getAttribute('data-nom');
            document.getElementById('form_cognom').value = elemento.getAttribute('data-cognom');
            document.getElementById('form_dni').value = elemento.getAttribute('data-dni');
            document.getElementById('form_email').value = elemento.getAttribute('data-email');
            document.getElementById('form_tel').value = elemento.getAttribute('data-tel');
            document.getElementById('form_dir').value = elemento.getAttribute('data-dir');
            document.getElementById('form_rol').value = elemento.getAttribute('data-rol');
        }

        function closeModal() {
            document.getElementById('userModal').classList.add('hidden');
            mainContent.classList.remove('blur-sm');
        }

        function openDeleteModal(dni) {
            document.getElementById('delete_dni').value = dni;
            document.getElementById('deleteModal').classList.remove('hidden');
            mainContent.classList.add('blur-sm');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            mainContent.classList.remove('blur-sm');
        }

        function filterUsers() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.user-card');
            cards.forEach(card => {
                const searchString = (card.getAttribute('data-nom') + " " + card.getAttribute('data-cognom') + " " + card.getAttribute('data-email') + " " + card.getAttribute('data-dni')).toLowerCase();
                card.style.display = searchString.includes(input) ? '' : 'none';
            });
        }

        window.onload = function() {
            var hasErrors = [[${hasErrors}]];
            var modeError = [[${modeError}]];
            
            if (hasErrors) {
                if (modeError === 'create') {
                    openModal('create');
                } else if (modeError === 'edit') {
                    openModal('editError');
                }
            }
        };
    </script>
</body>
</html>
